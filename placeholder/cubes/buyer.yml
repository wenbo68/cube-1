cubes:
  - name: buyer
    sql_table: monolis_staging.`Buyer`
    data_source: default

    joins: []

    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: number
        primary_key: true

      - name: abbreviation
        sql: "{CUBE}.`abbreviation`"
        type: string

      - name: address
        sql: "{CUBE}.`address`"
        type: string

      - name: bank_account
        sql: "{CUBE}.`bankAccount`"
        type: string

      - name: bank_name
        sql: "{CUBE}.`bankName`"
        type: string

      - name: beneficiary
        sql: "{CUBE}.`beneficiary`"
        type: string

      - name: name
        sql: "{CUBE}.`name`"
        type: string

      - name: swift_code
        sql: "{CUBE}.`swiftCode`"
        type: string

      - name: created_at
        sql: "{CUBE}.`createdAt`"
        type: time

      - name: updated_at
        sql: "{CUBE}.`updatedAt`"
        type: time

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

