cubes:
  - name: size_breakdown
    sql_table: monolis_staging.`SizeBreakdown`
    data_source: default

    joins: []

    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: number
        primary_key: true

      - name: name
        sql: "{CUBE}.`name`"
        type: string

      - name: created_at
        sql: "{CUBE}.`createdAt`"
        type: time

      - name: updated_at
        sql: "{CUBE}.`updatedAt`"
        type: time

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

