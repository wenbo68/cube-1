cubes:
  - name: bom_accessory
    sql_table: monolis_staging.`BOMAccessory`
    data_source: default

    joins:
      - name: sales_order
        sql: "{CUBE}.`salesOrderId` = {sales_order.id}"
        relationship: many_to_one

    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: number
        primary_key: true

      - name: acc_detail
        sql: "{CUBE}.`accDetail`"
        type: string

      - name: brand_item_code
        sql: "{CUBE}.`brandItemCode`"
        type: string

      - name: image
        sql: "{CUBE}.`image`"
        type: string

      - name: placement
        sql: "{CUBE}.`placement`"
        type: string

      - name: remark
        sql: "{CUBE}.`remark`"
        type: string

      - name: supplier_item_code
        sql: "{CUBE}.`supplierItemCode`"
        type: string

      - name: created_at
        sql: "{CUBE}.`createdAt`"
        type: time

      - name: updated_at
        sql: "{CUBE}.`updatedAt`"
        type: time

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

