cubes:
  - name: garment_color_way
    sql_table: monolis_staging.`GarmentColorWay`
    data_source: default

    joins:
      - name: sales_order
        sql: "{CUBE}.`salesOrderId` = {sales_order.id}"
        relationship: many_to_one

    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: number
        primary_key: true

      - name: color_name
        sql: "{CUBE}.`colorName`"
        type: string

      - name: remark
        sql: "{CUBE}.`remark`"
        type: string

      - name: sku_color_code
        sql: "{CUBE}.`skuColorCode`"
        type: string

      - name: created_at
        sql: "{CUBE}.`createdAt`"
        type: time

      - name: updated_at
        sql: "{CUBE}.`updatedAt`"
        type: time

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

