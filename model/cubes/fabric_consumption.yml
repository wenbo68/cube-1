cubes:
  - name: fabric_consumption
    sql_table: monolis_staging.`FabricConsumption`
    data_source: default

    joins:
      - name: sopo
        sql: "{CUBE}.`sopoId` = {sopo.id}"
        relationship: many_to_one

      - name: so_size
        sql: "{CUBE}.`soSizeId` = {so_size.id}"
        relationship: many_to_one

    dimensions:
      - name: id
        sql: "{CUBE}.`id`"
        type: string
        primary_key: true

      - name: cutting_way
        sql: "{CUBE}.`cuttingWay`"
        type: string

      - name: finish
        sql: "{CUBE}.`finish`"
        type: string

      - name: remark
        sql: "{CUBE}.`remark`"
        type: string

      - name: created_at
        sql: "{CUBE}.`createdAt`"
        type: time

      - name: updated_at
        sql: "{CUBE}.`updatedAt`"
        type: time

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

